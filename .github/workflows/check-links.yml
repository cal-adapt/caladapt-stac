name: Check Collection Links

on:
  schedule:
    - cron: "0 9 * * 1"  # Every Monday at 9am UTC
  push:
    branches:
      - main
  workflow_dispatch:  # Allow manual runs

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check collection links, assets and providers
        env:
          STAC_API_URL: https://stac.cal-adapt.org
        run: python3 scripts/check_links.py
