name: Check Collection Links

on:
  schedule:
    - cron: "0 9 * * 1"  # Every Monday at 9am UTC
  push:
    branches:
      - main
  workflow_dispatch:  # Allow manual runs

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check collection related links
        env:
          STAC_API_URL: https://8dawjspn5g.execute-api.us-west-2.amazonaws.com
        run: |
          python3 - <<'EOF'
          import sys
          import urllib.request
          import urllib.error
          import json

          api_url = "${{ env.STAC_API_URL }}"

          # Fetch all collections
          with urllib.request.urlopen(f"{api_url}/collections?limit=100") as r:
              collections = json.load(r)["collections"]

          # Skip auto-generated API links that point back to the API itself
          SKIP_RELS = {"self", "root", "items", "collection", "parent"}

          failures = []
          checked = 0

          def check_url(url, label):
              """Return None on success, or a failure message string."""
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "caladapt-link-checker/1.0"})
                  with urllib.request.urlopen(req, timeout=15) as r:
                      status = r.status
                  if status >= 400:
                      return f"  {status} {url} ({label})"
                  print(f"  ✓ {status} {url}")
                  return None
              except urllib.error.HTTPError as e:
                  return f"  {e.code} {url} ({label})"
              except Exception as e:
                  return f"  ERROR {url} ({label}): {e}"

          def check_all(url, label):
              nonlocal checked
              failure = check_url(url, label)
              if failure:
                  failures.append(failure)
              checked += 1

          for collection in collections:
              col_id = collection["id"]

              # Check all links except internal API links
              for link in collection.get("links", []):
                  if link.get("rel") not in SKIP_RELS:
                      check_all(link["href"], f"{col_id} link[rel={link.get('rel')}]")

              # Check all asset hrefs
              for asset_key, asset in collection.get("assets", {}).items():
                  check_all(asset["href"], f"{col_id} asset[{asset_key}]")

              # Check provider URLs
              for provider in collection.get("providers", []):
                  if url := provider.get("url"):
                      check_all(url, f"{col_id} provider[{provider.get('name')}]")

          if failures:
              print(f"\n❌ {len(failures)} broken link(s) found:")
              for f in failures:
                  print(f)
              sys.exit(1)
          else:
              print(f"\n✅ All {checked} links OK")
          EOF
